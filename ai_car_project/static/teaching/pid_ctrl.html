    <h4>3. PID 轉向回授控制</h4>
    <p>根據車道中心偏差量（Error = Target - Current_Offset）：</p>
    <ul>
        <li><strong>P (比例)：</strong>即時根據偏移程度進行反方向轉向修正。</li>
        <li><strong>I (積分)：</strong>消除長時間累積的微小靜態誤差（如輪子磨損或打滑）。</li>
        <li><strong>D (微分)：</strong>預測未來的變化趨勢，抑制轉向過猛造成的車體晃動。</li>
    </ul>
</div>
